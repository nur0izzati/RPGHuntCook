<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RPGHuntCook - Mobile Ready</title>
  <style>
    body {
      background-color: #1e1e2e;
      color: #cdd6f4;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 10px;
      box-sizing: border-box;
      touch-action: none; /* Prevents accidental zooming/scrolling on mobile */
    }

    #ui-bar {
      width: 100%;
      max-width: 500px;
      background-color: #313244;
      padding: 10px;
      box-sizing: border-box;
      border-radius: 8px 8px 0 0;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: bold;
      border: 2px solid #45475a;
      border-bottom: none;
    }

    canvas {
      background-color: #181825;
      border: 2px solid #45475a;
      display: block;
      width: 100%;
      max-width: 500px;
      height: 280px;
    }

    #action-panel {
      width: 100%;
      max-width: 500px;
      background-color: #313244;
      padding: 8px;
      box-sizing: border-box;
      border: 2px solid #45475a;
      border-top: none;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    button {
      background-color: #89b4fa;
      color: #11111b;
      border: none;
      padding: 8px 12px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      flex: 1;
    }

    button:disabled {
      background-color: #45475a;
      color: #6c7086;
      cursor: not-allowed;
    }

    #mobile-controls {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #242433;
      padding: 15px;
      box-sizing: border-box;
      border: 2px solid #45475a;
      border-top: none;
      border-radius: 0 0 8px 8px;
    }

    /* Virtual Joystick Area */
    #joystick-base {
      width: 100px;
      height: 100px;
      background-color: rgba(69, 71, 90, 0.6);
      border-radius: 50%;
      position: relative;
      touch-action: none;
    }

    #joystick-knob {
      width: 45px;
      height: 45px;
      background-color: #89b4fa;
      border-radius: 50%;
      position: absolute;
      top: 27.5px;
      left: 27.5px;
      pointer-events: none;
    }

    #attack-btn {
      width: 90px;
      height: 90px;
      background-color: #f38ba8;
      color: #11111b;
      border-radius: 50%;
      border: none;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    #attack-btn:active {
      background-color: #eba0ac;
      transform: scale(0.95);
    }

    #log {
      width: 100%;
      max-width: 500px;
      margin-top: 8px;
      padding: 8px 12px;
      background-color: #313244;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 12px;
      color: #a6e3a1;
      min-height: 20px;
      border: 2px solid #45475a;
    }
  </style>
</head>
<body>

  <!-- RPG INFO & STATS -->
  <div id="ui-bar">
    <span id="stat-gold">🪙 0</span>
    <span id="stat-meat">🥩 0</span>
    <span id="stat-dish">🍖 0</span>
    <span id="stat-hp">HP: 100</span>
  </div>

  <!-- GAME SCREEN -->
  <canvas id="gameCanvas" width="500" height="280"></canvas>

  <!-- KITCHEN CONTROLS -->
  <div id="action-panel">
    <button id="cook-btn" onclick="cookDish()" disabled>Cook (1 🥩)</button>
    <button id="sell-btn" onclick="sellDish()" disabled>Sell (+15 🪙)</button>
  </div>

  <!-- MOBILE VIRTUAL CONTROLS -->
  <div id="mobile-controls">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
    <button id="attack-btn" onclick="triggerAttack()">⚔️ ATTACK</button>
  </div>

  <!-- GAME MESSAGE LOG -->
  <div id="log">Use the joystick to move. Bump or press Attack near the slime!</div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const logEl = document.getElementById("log");

    // Player Data
    const player = {
      x: 50,
      y: 110,
      size: 28,
      speed: 3.5,
      hp: 100,
      maxHp: 100,
      gold: 0,
      rawMeat: 0,
      cookedDishes: 0
    };

    // Enemy Data
    let enemy = {
      x: 360,
      y: 110,
      size: 32,
      hp: 30,
      maxHp: 30,
      atk: 10,
      alive: true
    };

    // Keyboard Tracking (for PC testing)
    const keys = {};
    window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

    // Joystick State
    let joystickActive = false;
    let joystickMoveX = 0;
    let joystickMoveY = 0;

    const base = document.getElementById("joystick-base");
    const knob = document.getElementById("joystick-knob");

    // Touch Handling for Joystick
    base.addEventListener("touchstart", handleTouchStart, {passive: false});
    base.addEventListener("touchmove", handleTouchMove, {passive: false});
    base.addEventListener("touchend", handleTouchEnd, {passive: false});

    // Mouse support for joystick on PC browsers too
    base.addEventListener("mousedown", (e) => { joystickActive = true; handleMove(e.clientX, e.clientY); });
    window.addEventListener("mousemove", (e) => { if (joystickActive) handleMove(e.clientX, e.clientY); });
    window.addEventListener("mouseup", () => { resetJoystick(); });

    function handleTouchStart(e) {
      e.preventDefault();
      joystickActive = true;
      const touch = e.touches[0];
      handleMove(touch.clientX, touch.clientY);
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (!joystickActive) return;
      const touch = e.touches[0];
      handleMove(touch.clientX, touch.clientY);
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      resetJoystick();
    }

    function handleMove(clientX, clientY) {
      const rect = base.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      
      const dx = clientX - centerX;
      const dy = clientY - centerY;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const maxRadius = 40; // Max joystick pull distance

      let angle = Math.atan2(dy, dx);
      let pull = Math.min(distance, maxRadius);

      joystickMoveX = Math.cos(angle) * (pull / maxRadius);
      joystickMoveY = Math.sin(angle) * (pull / maxRadius);

      // Move knob visually
      knob.style.transform = `translate(${Math.cos(angle) * pull}px, ${Math.sin(angle) * pull}px)`;
    }

    function resetJoystick() {
      joystickActive = false;
      joystickMoveX = 0;
      joystickMoveY = 0;
      knob.style.transform = `translate(0px, 0px)`;
    }

    function updateUI() {
      document.getElementById("stat-gold").textContent = `🪙 ${player.gold}`;
      document.getElementById("stat-meat").textContent = `🥩 ${player.rawMeat}`;
      document.getElementById("stat-dish").textContent = `🍖 ${player.cookedDishes}`;
      document.getElementById("stat-hp").textContent = `HP: ${player.hp}`;

      document.getElementById("cook-btn").disabled = player.rawMeat < 1;
      document.getElementById("sell-btn").disabled = player.cookedDishes < 1;
    }

    function isColliding(a, b) {
      return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
      );
    }

    function respawnEnemy() {
      enemy.hp = enemy.maxHp;
      enemy.alive = true;
      enemy.x = Math.floor(Math.random() * (canvas.width - 100)) + 80;
      enemy.y = Math.floor(Math.random() * (canvas.height - 60)) + 30;
    }

    function cookDish() {
      if (player.rawMeat >= 1) {
        player.rawMeat--;
        player.cookedDishes++;
        logEl.textContent = "Cooked 1 Raw Meat into a Skewer! 🍖";
        updateUI();
      }
    }

    function sellDish() {
      if (player.cookedDishes >= 1) {
        player.cookedDishes--;
        player.gold += 15;
        logEl.textContent = "Sold a Dish for 15 Gold! 🪙";
        updateUI();
      }
    }

    // Attack Button Action
    function triggerAttack() {
      if (!enemy.alive || player.hp <= 0) return;

      // Check if player is close enough to hit the enemy
      const distanceX = Math.abs((player.x + player.size/2) - (enemy.x + enemy.size/2));
      const distanceY = Math.abs((player.y + player.size/2) - (enemy.y + enemy.size/2));

      if (distanceX < 60 && distanceY < 60) {
        enemy.hp -= 15;
        if (enemy.hp <= 0) {
          enemy.alive = false;
          player.rawMeat++;
          logEl.textContent = "Defeated Slime! Got 1x Raw Meat (🥩).";
          updateUI();
          setTimeout(respawnEnemy, 1500);
        } else {
          player.hp = Math.max(0, player.hp - enemy.atk);
          logEl.textContent = `Attacked Slime! Took ${enemy.atk} DMG back.`;
          if (player.hp === 0) logEl.textContent = "You fainted! Refresh to restart.";
        }
        updateUI();
      } else {
        logEl.textContent = "Too far away! Move closer to the slime to attack.";
      }
    }

    function update() {
      if (player.hp <= 0) return;

      // Movement from Joystick or Keyboard
      let moveX = joystickMoveX;
      let moveY = joystickMoveY;

      if (keys["w"] || keys["arrowup"]) moveY = -1;
      if (keys["s"] || keys["arrowdown"]) moveY = 1;
      if (keys["a"] || keys["arrowleft"]) moveX = -1;
      if (keys["d"] || keys["arrowright"]) moveX = 1;

      if (moveX !== 0 || moveY !== 0) {
        player.x += moveX * player.speed;
        player.y += moveY * player.speed;
      }

      // Boundary limits
      player.x = Math.max(0, Math.min(canvas.width - player.size, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.size, player.y));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw Player
      ctx.fillStyle = "#89b4fa";
      ctx.fillRect(player.x, player.y, player.size, player.size);

      // Draw Enemy
      if (enemy.alive) {
        ctx.fillStyle = "#f38ba8";
        ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);

        // Enemy HP bar
        ctx.fillStyle = "#45475a";
        ctx.fillRect(enemy.x, enemy.y - 6, enemy.size, 4);
        ctx.fillStyle = "#a6e3a1";
        ctx.fillRect(enemy.x, enemy.y - 6, enemy.size * (enemy.hp / enemy.maxHp), 4);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    updateUI();
    gameLoop();
  </script>
</body>
</html>
